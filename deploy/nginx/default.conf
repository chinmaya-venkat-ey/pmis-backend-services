server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # =========================================================
    # FRONTEND  (catch-all)
    # =========================================================
    location / {
        proxy_pass         http://host.docker.internal:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # MONOLITH BACKEND  (port 8000)
    # API  :  /api/v3/*   — current FE continues to work unchanged
    # Full :  /backend/*  — docs, admin, and anything else on root
    # =========================================================
    location /api/v3/ {
        proxy_pass         http://host.docker.internal:8000/api/v3/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /backend/ {
        proxy_pass         http://host.docker.internal:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # USER MANAGEMENT  (port 8011)
    # API  :  /users/*
    # Docs :  /users/docs   /users/redoc
    # =========================================================
    location = /users/openapi.json {
        proxy_pass         http://host.docker.internal:8011/openapi.json;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter_types   application/json;
        sub_filter         '"info":'  '"servers":[{"url":"/users"}],"info":';
        sub_filter_once    on;
    }

    location ^~ /users/docs {
        proxy_pass         http://host.docker.internal:8011/docs;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "url: '/openapi.json'"  "url: '/users/openapi.json'";
        sub_filter_once    on;
    }

    location ^~ /users/redoc {
        proxy_pass         http://host.docker.internal:8011/redoc;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "spec-url='/openapi.json'"  "spec-url='/users/openapi.json'";
        sub_filter_once    on;
    }

    location /users/ {
        proxy_pass         http://host.docker.internal:8011/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # PROJECT MANAGEMENT  (port 8013)
    # API  :  /projects/*
    # Docs :  /projects/docs   /projects/redoc
    # =========================================================
    location = /projects/openapi.json {
        proxy_pass         http://host.docker.internal:8013/openapi.json;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter_types   application/json;
        sub_filter         '"info":'  '"servers":[{"url":"/projects"}],"info":';
        sub_filter_once    on;
    }

    location ^~ /projects/docs {
        proxy_pass         http://host.docker.internal:8013/docs;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "url: '/openapi.json'"  "url: '/projects/openapi.json'";
        sub_filter_once    on;
    }

    location ^~ /projects/redoc {
        proxy_pass         http://host.docker.internal:8013/redoc;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "spec-url='/openapi.json'"  "spec-url='/projects/openapi.json'";
        sub_filter_once    on;
    }

    location /projects/ {
        proxy_pass         http://host.docker.internal:8013/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # MASTERS  (port 8004)
    # API  :  /master/*
    # Docs :  /master/docs   /master/redoc
    # =========================================================
    location = /master/openapi.json {
        proxy_pass         http://host.docker.internal:8004/openapi.json;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter_types   application/json;
        sub_filter         '"info":'  '"servers":[{"url":"/master"}],"info":';
        sub_filter_once    on;
    }

    location ^~ /master/docs {
        proxy_pass         http://host.docker.internal:8004/docs;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "url: '/openapi.json'"  "url: '/master/openapi.json'";
        sub_filter_once    on;
    }

    location ^~ /master/redoc {
        proxy_pass         http://host.docker.internal:8004/redoc;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "spec-url='/openapi.json'"  "spec-url='/master/openapi.json'";
        sub_filter_once    on;
    }

    location /master/ {
        proxy_pass         http://host.docker.internal:8004/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # NOTIFICATION SERVICE  (port 8012)
    # API  :  /notifications/*
    # Docs :  /notifications/docs   /notifications/redoc
    # =========================================================
    location = /notifications/openapi.json {
        proxy_pass         http://host.docker.internal:8012/openapi.json;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter_types   application/json;
        sub_filter         '"info":'  '"servers":[{"url":"/notifications"}],"info":';
        sub_filter_once    on;
    }

    location ^~ /notifications/docs {
        proxy_pass         http://host.docker.internal:8012/docs;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "url: '/openapi.json'"  "url: '/notifications/openapi.json'";
        sub_filter_once    on;
    }

    location ^~ /notifications/redoc {
        proxy_pass         http://host.docker.internal:8012/redoc;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "spec-url='/openapi.json'"  "spec-url='/notifications/openapi.json'";
        sub_filter_once    on;
    }

    location /notifications/ {
        proxy_pass         http://host.docker.internal:8012/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
