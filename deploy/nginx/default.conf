# =========================================================
# CORS origin whitelist — echoes back the exact Origin so
# credentials (Authorization header) are allowed.
# Add more origins here if needed (e.g. dev laptop).
# =========================================================
map $http_origin $cors_origin {
    "http://10.1.131.199:3000"  "http://10.1.131.199:3000";
    "http://localhost:3000"      "http://localhost:3000";
    "http://localhost:5173"      "http://localhost:5173";
    "http://localhost:4173"      "http://localhost:4173";
    default                      "";
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # =========================================================
    # FRONTEND  (catch-all)
    # =========================================================
    location / {
        proxy_pass         http://host.docker.internal:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # MONOLITH BACKEND  (port 8000)
    # API  :  /api/v3/*   — current FE continues to work unchanged
    # Full :  /backend/*  — docs, admin, and anything else on root
    # =========================================================
    location /api/v3/ {
        # Strip upstream CORS headers — nginx is the sole CORS controller
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Vary;

        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'       always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Request-ID' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'       always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Request-ID' always;
            add_header 'Access-Control-Max-Age'           86400 always;
            return 204;
        }

        proxy_pass         http://host.docker.internal:8000/api/v3/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /backend/ {
        proxy_pass         http://host.docker.internal:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # USER MANAGEMENT  (port 8011)
    # API  :  /users/*
    # Docs :  /users/docs   /users/redoc
    # =========================================================
    location = /users/openapi.json {
        proxy_pass         http://host.docker.internal:8011/openapi.json;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter_types   application/json;
        sub_filter         '"info":'  '"servers":[{"url":"/users"}],"info":';
        sub_filter_once    on;
    }

    location ^~ /users/docs {
        proxy_pass         http://host.docker.internal:8011/docs;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "url: '/openapi.json'"  "url: '/users/openapi.json'";
        sub_filter_once    on;
    }

    location ^~ /users/redoc {
        proxy_pass         http://host.docker.internal:8011/redoc;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "spec-url='/openapi.json'"  "spec-url='/users/openapi.json'";
        sub_filter_once    on;
    }

    location /users/ {
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'       always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Request-ID' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'       always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Request-ID' always;
            add_header 'Access-Control-Max-Age'           86400 always;
            return 204;
        }

        proxy_pass         http://host.docker.internal:8011/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # PROJECT MANAGEMENT  (port 8013)
    # API  :  /projects/*
    # Docs :  /projects/docs   /projects/redoc
    # =========================================================
    location = /projects/openapi.json {
