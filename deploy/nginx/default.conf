        proxy_set_header   Accept-Encoding  "";
        sub_filter         "url: '/openapi.json'"  "url: '/projects/openapi.json'";
        sub_filter_once    on;
    }

    location ^~ /projects/redoc {
        proxy_pass         http://host.docker.internal:8013/redoc;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "spec-url='/openapi.json'"  "spec-url='/projects/openapi.json'";
        sub_filter_once    on;
    }

    location /projects/ {
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'       always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Request-ID' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'       always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Request-ID' always;
            add_header 'Access-Control-Max-Age'           86400 always;
            return 204;
        }

        proxy_pass         http://host.docker.internal:8013/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # MASTERS  (port 8004)
    # API  :  /master/*
    # Docs :  /master/docs   /master/redoc
    # =========================================================
