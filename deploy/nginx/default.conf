        proxy_pass         http://host.docker.internal:8004/openapi.json;
        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter_types   application/json;
        sub_filter         '"info":'  '"servers":[{"url":"/master"}],"info":';
