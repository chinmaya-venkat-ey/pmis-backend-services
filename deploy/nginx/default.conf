        proxy_set_header   Host             $host;
        proxy_set_header   Accept-Encoding  "";
        sub_filter         "spec-url='/openapi.json'"  "spec-url='/master/openapi.json'";
        sub_filter_once    on;
    }

    location /master/ {
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'       always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Request-ID' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'       always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Request-ID' always;
            add_header 'Access-Control-Max-Age'           86400 always;
            return 204;
        }

        proxy_pass         http://host.docker.internal:8004/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # NOTIFICATION SERVICE  (port 8012)
    # API  :  /notifications/*
    # Docs :  /notifications/docs   /notifications/redoc
    # =========================================================
