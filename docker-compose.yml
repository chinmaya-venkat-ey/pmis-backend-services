# ================================================================
# PMIS User Management Service – docker-compose.yml
# ================================================================
# This compose file runs ONLY the user-management service.
# PostgreSQL is already running as 'pmis-postgres' on the host.
#
# network_mode: host  →  container shares host's network stack,
# so DATABASE_URL points to localhost:5432 (the exposed postgres).
#
# Usage:
#   docker compose up -d          # start
#   docker compose logs -f        # follow logs
#   docker compose down           # stop
#   docker compose up -d --build  # rebuild + restart
# ================================================================

name: pmis-usermanagement

services:
  pmis-usermanagement:
    image: ritamhudait/pmis-usermanagement:${IMAGE_TAG:-latest}
    container_name: pmis-usermanagement
    restart: unless-stopped

    # Shares host network — lets the container reach
    # pmis-postgres at localhost:5432 without extra network config.
    network_mode: host

    env_file:
      - /home/uidaiadmin/pmis-usermanagement/.env

    # Healthcheck hits the /health endpoint
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
