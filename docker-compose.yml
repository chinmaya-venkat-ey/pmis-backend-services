name: pmis-usermanagement

services:
  pmis-usermanagement:
    image: ritamhudait/pmis-usermanagement:${IMAGE_TAG:-latest}
    container_name: pmis-usermanagement
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - /home/uidaiadmin/pmis-usermanagement/.env
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
