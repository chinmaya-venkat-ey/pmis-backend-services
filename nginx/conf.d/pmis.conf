# ILLUSTRATIVE server block — devops adapts.

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;         # matches MAX_UPLOAD_MB=25 (Q22)
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # === Backend services ===
    location /user/ {
        proxy_pass http://pmis_user;
        include conf.d/proxy_headers.inc;
    }
    location /project/ {
        proxy_pass http://pmis_project;
        include conf.d/proxy_headers.inc;
    }
    location /notification/ {
        proxy_pass http://pmis_notification;
        include conf.d/proxy_headers.inc;
    }
    location /masters/ {
        proxy_pass http://pmis_masters;
        include conf.d/proxy_headers.inc;
    }

    # === Health-check passthroughs (orchestrator probes) ===
    location = /health/user         { proxy_pass http://pmis_user/health;         include conf.d/proxy_headers.inc; }
    location = /health/project      { proxy_pass http://pmis_project/health;      include conf.d/proxy_headers.inc; }
    location = /health/notification { proxy_pass http://pmis_notification/health; include conf.d/proxy_headers.inc; }
    location = /health/masters      { proxy_pass http://pmis_masters/health;      include conf.d/proxy_headers.inc; }
    location = /ready/user          { proxy_pass http://pmis_user/ready;          include conf.d/proxy_headers.inc; }
    location = /ready/project       { proxy_pass http://pmis_project/ready;       include conf.d/proxy_headers.inc; }
    location = /ready/notification  { proxy_pass http://pmis_notification/ready;  include conf.d/proxy_headers.inc; }
    location = /ready/masters       { proxy_pass http://pmis_masters/ready;       include conf.d/proxy_headers.inc; }

    # === Frontend (catch-all) ===
    location / {
        proxy_pass http://pmis_frontend;
        include conf.d/proxy_headers.inc;
    }

    # NOTE: CORS configuration is devops's responsibility in production
    # (per Decision 8e). Services include CORSMiddleware only when
    # ENV=development; do not duplicate CORS headers in both layers.
}
