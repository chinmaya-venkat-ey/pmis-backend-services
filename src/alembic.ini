# pmis-project-service — Alembic config.
#
# Owns DDL for the project-management tables (projects, milestones,
# activities, tasks, subtasks, comments, attachments, vendors,
# resource_types, divisions, project_status_transitions, ...).
#
# Uses a separate version table (alembic_version_project_svc) so it does
# NOT collide with:
#   - the monolith's chain (alembic_version)
#   - the user-service's chain (alembic_version_user_svc)
# All three migration chains run against the same shared DB.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is overridden from settings in alembic/env.py. The value
# below is only a placeholder so Alembic's config loader is happy.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
